{% extends 'base.html' %}

{% block title %}Change Password - IntelliHub AI{% endblock %}
{% block page_title %}Security & Password Update{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="glass-card p-4 p-md-5">
            <h4 class="fw-bold mb-4"><i class="fa-solid fa-lock text-info me-2"></i> Update Password</h4>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-gradient-primary w-100 mt-3">
                    <i class="fa-solid fa-shield-check me-2"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
